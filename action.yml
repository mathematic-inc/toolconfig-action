name: ToolConfig
description: Check and generate ToolConfig files, and fail when a tracked file is not current.
author: Mathematic
inputs:
  working-directory:
    description: Directory of the ToolConfig root source. A relative path starts at github.workspace.
    default: .
  client-id:
    description: Client ID of a GitHub App that can read the private repositories. Give it with private-key and repositories.
  private-key:
    description: Private key of that GitHub App.
  repositories:
    description: The private repositories that ToolConfig fetches, one owner/name on each line, all with one owner.
branding:
  icon: check-square
  color: blue
runs:
  using: composite
  steps:
    - name: Read the GitHub App inputs
      id: app
      shell: bash
      env:
        TOOLCONFIG_CLIENT_ID: ${{ inputs.client-id }}
        TOOLCONFIG_PRIVATE_KEY_SET: ${{ inputs.private-key != '' }}
        TOOLCONFIG_REPOSITORIES: ${{ inputs.repositories }}
      run: bash "$GITHUB_ACTION_PATH/app-inputs.sh"
    - name: Get a read-only token for the private repositories
      id: token
      if: steps.app.outputs.private == 'true'
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.app.outputs.owner }}
        repositories: ${{ steps.app.outputs.names }}
        permission-contents: read
    - name: Check and generate with the private repositories
      if: steps.app.outputs.private == 'true'
      uses: mathematic-inc/scoped-git-token-action@bc7f1fae365ee7ae6b304713303b656df1096eeb # v2026.11.0
      env:
        TOOLCONFIG_ACTION_PATH: ${{ github.action_path }}
      with:
        token: ${{ steps.token.outputs.token }}
        repositories: ${{ inputs.repositories }}
        working-directory: ${{ inputs.working-directory }}
        run: bash "$TOOLCONFIG_ACTION_PATH/toolconfig.sh"
    - name: Check and generate
      if: steps.app.outputs.private != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "$GITHUB_ACTION_PATH/toolconfig.sh"

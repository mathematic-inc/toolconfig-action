name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  verify-action:
    name: Verify action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: toolconfig
      - name: Check repository root
        uses: $/
      - name: Check project in sub-directory
        uses: $/
        with:
          working-directory: tests/current
      - name: Check project with stale tracked file
        id: stale
        continue-on-error: true
        uses: $/
        with:
          working-directory: tests/stale
      - name: Verify stale project failed before generation
        env:
          STALE_OUTCOME: ${{ steps.stale.outcome }}
        run: |
          test "$STALE_OUTCOME" = failure
          git diff --exit-code -- tests/stale
      - name: Give only some GitHub App inputs
        id: some-app-inputs
        continue-on-error: true
        uses: $/
        with:
          client-id: Iv23test
          repositories: mathematic-inc/toolconfig-config
      - name: Verify some GitHub App inputs failed
        env:
          SOME_APP_INPUTS_OUTCOME: ${{ steps.some-app-inputs.outcome }}
        run: test "$SOME_APP_INPUTS_OUTCOME" = failure
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Check and generate ToolConfig files
        uses: $/
      - name: Run checks
        run: hk check --all --slow --skip-step toolconfig
      - name: Run contract tests
        run: bash tests/contracts.sh
  required:
    name: required
    if: ${{ always() }}
    needs:
      - verify-action
      - check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check every other job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
